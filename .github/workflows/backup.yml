name: Backup diário do banco

# Cópia completa do banco do Valtrea Pay (Neon), criptografada com AES-256, guardada por 30 dias
# na aba Actions. Como restaurar: docs/BACKUP.md.

on:
  schedule:
    # 06:20 UTC = 03:20 no horário de Brasília (o backup do Finance roda às 03:00)
    - cron: '20 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    name: Copiar e criptografar o banco
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Conferir segredos
        env:
          DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$DATABASE_URL" ] || [ -z "$PASSPHRASE" ]; then
            echo "::error::Configure os segredos BACKUP_DATABASE_URL e BACKUP_PASSPHRASE no repositório (veja docs/BACKUP.md)."
            exit 1
          fi

      - name: Gerar o backup (pg_dump)
        env:
          DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
        run: |
          docker run --rm -e DATABASE_URL postgres:18 \
            sh -c 'pg_dump "$DATABASE_URL" --format=custom --no-owner --no-acl' > backup.dump
          SIZE=$(stat -c %s backup.dump)
          echo "Tamanho do backup: $SIZE bytes"
          if [ "$SIZE" -lt 1000 ]; then
            echo "::error::Backup vazio ou muito pequeno. Verifique a conexão com o banco."
            exit 1
          fi

      - name: Criptografar
        env:
          PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          NAME="valtrea-pay-backup-$(date -u +%Y-%m-%d).dump.gpg"
          gpg --batch --yes --pinentry-mode loopback --passphrase "$PASSPHRASE" \
            --symmetric --cipher-algo AES256 --output "$NAME" backup.dump
          rm backup.dump
          echo "BACKUP_FILE=$NAME" >> "$GITHUB_ENV"

      - name: Guardar o backup criptografado
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.BACKUP_FILE }}
          path: ${{ env.BACKUP_FILE }}
          retention-days: 30
          if-no-files-found: error
