# Dependabot: avisa e abre pull requests quando sair atualização das bibliotecas.
# Correções de segurança chegam assim que publicadas (ative "Dependabot alerts" e "security updates"
# em Settings > Code security); o resto, uma vez por semana.
version: 2
updates:
  - package-ecosystem: maven
    directory: /api
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    ignore:
      # Versões novas grandes mudam o código; atualizar com calma, não por PR automático
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      api-pequenas:
        update-types: [minor, patch]

  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      app-pequenas:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /api
    schedule:
      interval: monthly
    ignore:
      # Fica no Java 21 (versão de suporte longo) até a troca ser planejada e testada
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
