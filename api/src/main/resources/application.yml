server:
  # O Render informa a porta pela variável PORT; localmente fica 8080.
  port: ${PORT:8080}
  # Atrás do proxy do Render, para os links e o IP do cliente saírem certos.
  forward-headers-strategy: framework

spring:
  application:
    name: valtrea-pay-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/valtrea_pay}
    username: ${DATABASE_USER:valtrea}
    password: ${DATABASE_PASSWORD:valtrea}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  threads:
    virtual:
      enabled: true
  # SMTP só no desenvolvimento (Mailpit, no compose.yaml). Em produção os e-mails vão pela API HTTP do
  # Resend (valtrea.email.resend-api-key), porque o plano gratuito do Render bloqueia as portas de SMTP.
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USER:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:false}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000

valtrea:
  jwt:
    # Pelo menos 32 caracteres. Nunca use o valor de desenvolvimento em produção.
    segredo: ${VALTREA_JWT_SECRET}
    # Token de acesso curto; o app renova sozinho usando a sessão.
    validade: 15m
    validade-sessao: 30d
  login:
    tentativas-maximas: 5
    bloqueio: 15m
  codigo:
    validade: 15m
    tentativas-maximas: 5
    intervalo-reenvio: 60s
  email:
    remetente: ${MAIL_FROM:Valtrea <nao-responda@valtrea.com.br>}
    # Chave da API do Resend (re_...). Preenchida, os e-mails saem pela API HTTP; vazia, por SMTP.
    # Aceita também MAIL_PASSWORD, onde a chave já foi colada na primeira publicação no Render.
    resend-api-key: ${RESEND_API_KEY:${MAIL_PASSWORD:}}
  finance:
    url: ${VALTREA_FINANCE_URL:}
    # Gere com: openssl rand -base64 32. Trocar a chave invalida as conexões já feitas.
    chave-cifra: ${VALTREA_CHAVE_CIFRA}
    intervalo-envio-ms: 5000
  sandbox:
    # Libera POST /api/v1/depositos para colocar saldo de teste na conta.
    habilitado: ${VALTREA_SANDBOX:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  health:
    # A API está de pé mesmo se o e-mail falhar (os envios têm tratamento próprio). Sem isso, o servidor de e-mail
    # fora do alcance derrubava a verificação de saúde e o Render nunca terminava a publicação.
    mail:
      enabled: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html
