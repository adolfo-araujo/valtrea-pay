<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="500" viewBox="0 0 1024 500">
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1712"/>
      <stop offset="1" stop-color="#0F3D2E"/>
    </linearGradient>
    <linearGradient id="cartao" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22C55E"/>
      <stop offset="1" stop-color="#16A34A"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="500" fill="url(#fundo)"/>

  <!-- Logo e textos à esquerda -->
  <g transform="translate(64 120) scale(1.6)">
    <path fill="#16A34A" d="M31,35 L44,35 L59,67 L53,79 Z" transform="translate(-31 -35)"/>
    <path fill="#22C55E" d="M64,35 L77,35 L57,77 C55.5,80 52,80 50.5,77 L48,71 Z" transform="translate(-31 -35)"/>
  </g>
  <text x="160" y="190" font-family="Inter, sans-serif" font-size="64" font-weight="700" fill="#FFFFFF">Valtrea Pay</text>
  <text x="66" y="270" font-family="Inter, sans-serif" font-size="34" font-weight="600" fill="#22C55E">Pague e receba em segundos</text>
  <text x="66" y="320" font-family="Inter, sans-serif" font-size="24" fill="#CBD5E1">Por nome, e-mail ou QR Code.</text>
  <text x="66" y="356" font-family="Inter, sans-serif" font-size="24" fill="#CBD5E1">Integrado ao Valtrea Finance.</text>

  <!-- Cartão de saldo ilustrativo à direita -->
  <g transform="translate(640 110)">
    <rect width="320" height="200" rx="28" fill="url(#cartao)"/>
    <text x="28" y="52" font-family="Inter, sans-serif" font-size="20" fill="#FFFFFF" fill-opacity="0.85">Saldo disponível</text>
    <text x="28" y="104" font-family="Inter, sans-serif" font-size="44" font-weight="700" fill="#FFFFFF">R$ 1.250,00</text>
    <rect x="28" y="136" width="120" height="40" rx="20" fill="#FFFFFF"/>
    <text x="88" y="163" text-anchor="middle" font-family="Inter, sans-serif" font-size="18" font-weight="600" fill="#0F3D2E">Pagar</text>
    <rect x="160" y="136" width="132" height="40" rx="20" fill="#FFFFFF"/>
    <text x="226" y="163" text-anchor="middle" font-family="Inter, sans-serif" font-size="18" font-weight="600" fill="#0F3D2E">Receber</text>
  </g>
  <g transform="translate(640 330)">
    <rect width="320" height="64" rx="16" fill="#13221B"/>
    <circle cx="34" cy="32" r="18" fill="#22C55E" fill-opacity="0.15"/>
    <text x="34" y="39" text-anchor="middle" font-family="Inter, sans-serif" font-size="20" fill="#22C55E">↙</text>
    <text x="62" y="38" font-family="Inter, sans-serif" font-size="17" fill="#FFFFFF">De Ana · Pizza</text>
    <text x="300" y="38" text-anchor="end" font-family="Inter, sans-serif" font-size="18" font-weight="700" fill="#22C55E">+ R$ 45,00</text>
  </g>
</svg>
